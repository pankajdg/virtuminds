[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static files in `dist` win; everything else is served by the Nitro SSR
# function emitted to .netlify/functions-internal/server.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
